name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and current.
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # dist/ is committed so installs from git need no build tooling. A stale
      # one means users get code that does not match src/.
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ \
            || { echo "::error::dist/ is stale. Run 'npm run build' and commit."; exit 1; }
